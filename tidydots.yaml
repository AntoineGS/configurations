  - package:
      managers:
        yay: vicinae-bin
    name: vicinae
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/vicinae
        name: config
        backup: ./Linux/vicinae
        files:
          - settings.json
      - targets:
          linux: ~/.local/share/vicinae/scripts
        name: scripts
        backup: ./Linux/vicinae/scripts
      - check:
