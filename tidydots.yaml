        brew: zoxide
        pacman: zoxide
        winget: ajeetdsouza.zoxide
    name: zoxide
    description: Smarter cd command
    entries:
      - targets:
          linux: "~"
          windows: "~"
        name: config
        backup: ./Both/Zoxide
