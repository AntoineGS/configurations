        brew: carapace
        winget: rsteube.Carapace
        yay: carapace-bin
    name: carapace
    entries:
      - targets:
          linux: ~/.cache/carapace
          windows: ~/.cache/carapace
        name: config
        backup: ./Both/Carapace
        files:
          - init.nu
  - package:
      managers:
        brew: yazi
        pacman: yazi
        winget:
          deps:
            - 7zip.7zip
            - jqlang.jq
            - sharkdp.fd
            - burntsushi.ripgrep.msvc
            - junegunn.fzf
            - ajeetdsouza.zoxide
            - imagemagick.imagemagick
