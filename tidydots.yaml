        name: plugins
        backup: ./Both/Zellij/plugins
  - package:
      managers:
        pacman: hyprland
    name: hyprland
    description: Dynamic tiling Wayland compositor
    when: '{{ and (eq .OS "linux") (or .HasDisplay (eq .Hostname "antoinews-linux")) (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/hypr
        name: config
        backup: ./Linux/hypr
      - targets:
          linux: ~/.local/bin
        name: screencopy-picker
        backup: ./Linux/hypr
        files:
          - xdph-share-picker
      - targets:
          linux: ~/.config/systemd/user
        name: rustdesk-service
        backup: ./Linux/hypr
        files:
          - watch-rustdesk-submap.service
      - check:
          linux: systemctl --user is-enabled --quiet watch-rustdesk-submap.service
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now watch-rustdesk-submap.service
        name: enable-rustdesk-service
      - targets:
          linux: ~/.config/systemd/user
        name: external-keyboard-service
        backup: ./Linux/hypr
        files:
          - watch-external-keyboard.service
      - check:
          linux: systemctl --user is-enabled --quiet watch-external-keyboard.service
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now watch-external-keyboard.service
        name: enable-external-keyboard-service
  - name: rustdesk-focus-handoff
    description: Return host-edge focus navigation to the RustDesk client
    when: '{{ and (eq .OS "linux") (eq .Hostname "DESKTOP-E07VTRN") }}'
    entries:
      - targets:
          linux: ~/.config/systemd/user
        name: service
        backup: ./Linux/hypr
        files:
          - rustdesk-focus-handoff.service
      - check:
          linux: ~/.config/hypr/setup-rustdesk-focus-handoff --check
        run:
          linux: ~/.config/hypr/setup-rustdesk-focus-handoff --apply
        name: enable-service
  - name: rustdesk-drm-preview
    description: Install the temporary RustDesk DRM preview package
    when: '{{ and (eq .OS "linux") (eq .Distro "arch") (or .HasDisplay (eq .Hostname "antoinews-linux")) (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.local/bin
        name: installer
        backup: ./Linux/rustdesk
        files:
          - install-rustdesk-drm-preview
      - check:
          linux: ~/.local/bin/install-rustdesk-drm-preview --check
        run:
          linux: sudo ~/.local/bin/install-rustdesk-drm-preview --apply
        name: package
  - name: rustdesk-server-keepalive
    description: Suppress RustDesk's timed Linux server recycling
    when: '{{ and (eq .OS "linux") (or .HasDisplay (eq .Hostname "antoinews-linux")) (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.local/bin
        name: marker
        backup: ./Linux/rustdesk
        files:
          - rustdesk-cm-marker
      - targets:
          linux: ~/.config/systemd/user
        name: service
        backup: ./Linux/rustdesk
        files:
          - rustdesk-cm-marker.service
      - check:
          linux: ~/.local/bin/rustdesk-cm-marker --check
        run:
          linux: ~/.local/bin/rustdesk-cm-marker --apply
        name: enable-service
  - name: rustdesk-wayland
    description: Give the RustDesk system service access to the antoinews-linux Wayland clipboard
    when: '{{ eq .Hostname "antoinews-linux" }}'
    entries:
      - targets:
          linux: /etc/systemd/system/rustdesk.service.d
        name: service-environment
        method: copy
        backup: ./Linux/rustdesk/rustdesk.service.d
        files:
          - wayland-session.conf
        sudo: true
      - check:
          linux: env="$(systemctl show rustdesk --property=Environment --value)"; printf '%s\n' "$env" | grep -q 'WAYLAND_DISPLAY=wayland-1' && printf '%s\n' "$env" | grep -q 'XDG_RUNTIME_DIR=/run/user/155801123' && printf '%s\n' "$env" | grep -q 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/155801123/bus' && printf '%s\n' "$env" | grep -q 'XDG_SESSION_TYPE=wayland'
        run:
          linux: systemctl daemon-reload && systemctl restart rustdesk
        name: reload-service
        sudo: true
