  - name: snapshots-enabled
    description: Enable btrfs snapshots + limine boot-menu sync on every Linux host except the laptop (omarchbook keeps them off for disk space)
    when: '{{ and (eq .OS "linux") (ne .Hostname "omarchbook") }}'
    entries:
      - name: enable-snapper-timers
        check:
          linux: systemctl is-enabled --quiet snapper-timeline.timer && systemctl is-enabled --quiet snapper-cleanup.timer
        run:
          linux: systemctl enable --now snapper-timeline.timer snapper-cleanup.timer
        sudo: true
      - name: enable-snapper-sync
        check:
          linux: systemctl is-enabled --quiet limine-snapper-sync.service
        run:
          linux: systemctl daemon-reload && systemctl enable --now limine-snapper-sync.service
        sudo: true
  - name: snapshots-disabled
    description: Keep btrfs snapshots + limine sync off on the laptop to conserve disk space (snapper/limine stay installed, just dormant)
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - name: disable-snapper-timers
        check:
          linux: '! systemctl is-enabled --quiet snapper-timeline.timer && ! systemctl is-enabled --quiet snapper-cleanup.timer'
        run:
          linux: systemctl disable --now snapper-timeline.timer snapper-cleanup.timer
        sudo: true
      - name: disable-snapper-sync
        check:
          linux: '! systemctl is-enabled --quiet limine-snapper-sync.service'
        run:
          linux: systemctl disable --now limine-snapper-sync.service
        sudo: true
  - name: tailscale-subnet-router
    description: Advertise 192.168.1.0/24 via Tailscale so remote clients reach the RustDesk relay (server only)
    when: '{{ eq .Hostname "server" }}'
    entries:
      - targets:
          linux: /etc/sysctl.d
        name: ip-forwarding
        backup: ./Linux/tailscale
        files:
          - 99-tailscale.conf
        sudo: true
      - targets:
          linux: ~/.local/share/helpers
        name: setup script
        backup: ./Linux/tailscale
        files:
          - setup-subnet-router.sh
      - name: advertise-subnet-route
        check:
          linux: tailscale debug prefs | grep -q '192.168.1.0/24'
        run:
          linux: ~/.local/share/helpers/setup-subnet-router.sh
  - name: cache-cleanup
    description: Weekly reclamation of pacman, yay/AUR and Go caches (laptop disk-pressure mitigation)
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/systemd/system
        name: pacman-cache-units
        backup: ./Linux/cache-cleanup
        files:
          - pacman-cache-clean.service
          - pacman-cache-clean.timer
        sudo: true
      - targets:
          linux: /etc/pacman.d/hooks
        name: prune-all-cache-hook
        backup: ./Linux/cache-cleanup
        files:
          - clean-cache.hook
        sudo: true
      - check:
          linux: systemctl is-enabled --quiet pacman-cache-clean.timer
        run:
          linux: systemctl daemon-reload && systemctl enable --now pacman-cache-clean.timer
        name: enable-pacman-cache-timer
        sudo: true
      - targets:
          linux: ~/.local/bin
        name: user-cache-script
        backup: ./Linux/cache-cleanup
        files:
          - clean-user-cache
      - targets:
          linux: ~/.config/systemd/user
        name: user-cache-units
        backup: ./Linux/cache-cleanup
        files:
          - user-cache-clean.service
          - user-cache-clean.timer
      - name: enable-user-cache-timer
        check:
          linux: systemctl --user is-enabled --quiet user-cache-clean.timer
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now user-cache-clean.timer
