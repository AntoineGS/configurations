version: 3
manager_priority:
  - pacman
  - yay
  - paru
  - apt
  - brew
  - winget
applications:
  - package:
      managers:
        apt: jq
        brew: jq
        pacman: jq
    name: jq
    description: JSON processor used by Herdr SSH automation
    when: '{{ eq .OS "linux" }}'
    entries: []
  - package:
      managers:
        installer:
          command:
            linux: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          binary: brew
    name: homebrew
    when: '{{ eq .OS "linux" }}'
    entries: []
  - package:
      managers:
        installer:
          command:
            linux: curl -fsSL https://claude.ai/install.sh | bash
            windows: irm https://claude.ai/install.ps1 | iex
          binary: claude
    name: claude code
    description: AI assistant CLI
    when: '{{ ne .Distro "ubuntu" }}'
    entries:
      - targets:
          linux: ~/.claude
          windows: ~/.claude
        name: config
        backup: ./Both/ClaudeCode
  - name: ccstatusline
    description: Claude Code status line (runs via npx, no install needed)
    entries:
      - targets:
          linux: ~/.config/ccstatusline
          windows: ~/.config/ccstatusline
        name: config
        backup: ./Both/ccstatusline
        files:
          - settings.json
  - package:
      managers:
        brew: opencode
        yay: opencode-bin
    name: opencode
    description: AI coding agent — Claude Max subscription via opencode-with-claude/Meridian plugin; context analysis and magic-context plugins
    entries:
      - check:
          linux: npm ls -g opencode-with-claude >/dev/null 2>&1
          windows: npm ls -g opencode-with-claude *> $null
        run:
          linux: npm install -g opencode-with-claude
          windows: npm install -g opencode-with-claude
        name: claude-plugin
        when: '{{ eq .Hostname "ANTOINEWS" }}'
      - check:
          linux: '[ "$(readlink ~/.local/bin/opencode-v)" = "$HOME/.ocv/bin/ocv" ]'
        run:
          linux: mkdir -p ~/.local/bin && ln -sf ~/.ocv/bin/ocv ~/.local/bin/opencode-v
        name: opencode-v symlink
      - targets:
          linux: ~/.config/opencode
          windows: ~/.config/opencode
        name: config
        backup: ./Linux/opencode
      - targets:
          linux: ~/.config/user-tmpfiles.d
        name: temp-cleanup
        backup: ./Linux/user-tmpfiles.d
        files:
          - opencode.conf
      - check:
          linux: >-
            test -d /tmp/opencode &&
            test ! -L /tmp/opencode &&
            test "$(stat -c %u /tmp/opencode)" = "$(id -u)" &&
            test "$(stat -c %a /tmp/opencode)" = 700 &&
            systemctl --user is-enabled --quiet systemd-tmpfiles-clean.timer &&
            systemctl --user is-active --quiet systemd-tmpfiles-clean.timer
        run:
          linux: >-
            systemd-tmpfiles --user --create ~/.config/user-tmpfiles.d/opencode.conf &&
            systemctl --user enable --now systemd-tmpfiles-clean.timer
        name: enable-temp-cleanup-timer
      - check:
          linux: test -f ~/.config/opencode/plugins/vendor/node_modules/js-tiktoken/package.json && test -f ~/.config/opencode/plugins/vendor/node_modules/@huggingface/transformers/package.json
          windows: 'if ((Test-Path -LiteralPath "$HOME/.config/opencode/plugins/vendor/node_modules/js-tiktoken/package.json") -and (Test-Path -LiteralPath "$HOME/.config/opencode/plugins/vendor/node_modules/@huggingface/transformers/package.json")) { exit 0 } else { exit 1 }'
        run:
          linux: npm install js-tiktoken@latest @huggingface/transformers@^3.3.3 --omit=dev --no-audit --loglevel=error --prefix ~/.config/opencode/plugins/vendor
          windows: 'npm install "js-tiktoken@latest" "@huggingface/transformers@^3.3.3" --omit=dev --no-audit --loglevel=error --prefix "$HOME/.config/opencode/plugins/vendor"'
        name: context-analysis tokenizers
  - package:
      managers:
        apt: neovim
        brew: neovim
        pacman: neovim
        winget: Neovim.Neovim
    name: neovim
    description: Vim-fork focused on extensibility and usability
    entries:
      - targets:
          linux: ~/.config/nvim
          windows: ~/AppData/Local/nvim
        name: config
        backup: ./Both/Neovim/nvim
      - targets:
          linux: ~/.local/share/nvim/site/spell
          windows: ~/AppData/Local/nvim-data/site/spell
        name: spell
        backup: ./Both/Neovim/spell
        files:
          - en.utf-8.add
  - package:
      managers:
        brew: starship
        pacman: starship
        winget: Starship.Starship
    name: starship
    description: Cross-shell prompt
    entries:
      - targets:
          linux: ~/.config
          windows: ~/.config
        name: config
        backup: ./Both/Starship
        files:
          - starship.toml
      - targets:
          linux: ~/.cache/starship
          windows: ~/.cache/starship
        name: cache
        backup: ./Both/Starship
        files:
          - init.nu
  - package:
      managers:
        winget: Nushell.Nushell
      custom:
        linux: cargo install nu --locked --version 0.113.1 --root "$HOME/.local"
    name: nushell
    description: A new type of shell
    entries:
      - targets:
          linux: ~/.config/nushell
          windows: ~/AppData/Roaming/nushell
        name: config
        backup: ./Both/Nushell
        files:
          - env.nu
          - config.nu
      - targets:
          linux: ~/.config/nushell/themes
          windows: ~/AppData/Roaming/nushell/themes
        name: themes
        backup: ./Both/Nushell/themes
      - check:
          linux: 'test -x "$HOME/.local/bin/nu" && test "$("$HOME/.local/bin/nu" --version 2>/dev/null)" = 0.113.1'
        run:
          linux: cargo install nu --locked --version 0.113.1 --root "$HOME/.local"
        name: exact-linux-version
  - package:
      managers:
        brew: wezterm
        pacman: wezterm
        winget: wez.wezterm
    name: wezterm
    description: GPU-accelerated terminal emulator
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          linux: "~"
          windows: "~"
        name: config
        backup: ./Both/Wezterm
