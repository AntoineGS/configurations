version: 3
manager_priority:
  - pacman
  - yay
  - paru
  - apt
  - brew
  - winget
applications:
  - package:
      managers:
        apt: jq
        brew: jq
        pacman: jq
    name: jq
    description: JSON processor used by Herdr SSH automation
    when: '{{ eq .OS "linux" }}'
    entries: []
  - package:
      managers:
        apt: shellcheck
        brew: shellcheck
        pacman: shellcheck
    name: shellcheck
    description: Static analysis for shell scripts
    when: '{{ eq .OS "linux" }}'
    entries: []
  - package:
      managers:
        installer:
          command:
            linux: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          binary: brew
    name: homebrew
    when: '{{ eq .OS "linux" }}'
    entries: []
  - package:
      managers:
        installer:
          command:
            linux: curl -fsSL https://claude.ai/install.sh | bash
            windows: irm https://claude.ai/install.ps1 | iex
          binary: claude
    name: claude code
    description: AI assistant CLI
    when: '{{ ne .Distro "ubuntu" }}'
    entries:
      - targets:
          linux: ~/.claude
          windows: ~/.claude
        name: config
        backup: ./Both/ClaudeCode
  - name: ccstatusline
    description: Claude Code status line (runs via npx, no install needed)
    entries:
      - targets:
          linux: ~/.config/ccstatusline
          windows: ~/.config/ccstatusline
        name: config
        backup: ./Both/ccstatusline
        files:
          - settings.json
  - package:
      managers:
        brew: opencode
        yay: opencode-vim-bin
    name: opencode
    description: AI coding agent — Claude Max subscription via opencode-with-claude/Meridian plugin; context analysis and magic-context plugins
    entries:
      - check:
          linux: npm ls -g opencode-with-claude >/dev/null 2>&1
          windows: npm ls -g opencode-with-claude *> $null
        run:
          linux: npm install -g opencode-with-claude
          windows: npm install -g opencode-with-claude
        name: claude-plugin
      - check:
          linux: '[ "$(readlink ~/.local/bin/opencode-v)" = "$HOME/.ocv/bin/ocv" ]'
        run:
          linux: mkdir -p ~/.local/bin && ln -sf ~/.ocv/bin/ocv ~/.local/bin/opencode-v
        name: opencode-v symlink
      - targets:
          linux: ~/.config/opencode
          windows: ~/.config/opencode
        name: config
        backup: ./Linux/opencode
      - check:
          linux: "herdr integration status | grep -q '^opencode: current '"
        run:
          linux: herdr integration install opencode
        name: herdr-integration
      - targets:
          linux: ~/.config/user-tmpfiles.d
        name: temp-cleanup
        backup: ./Linux/user-tmpfiles.d
        files:
          - opencode.conf
      - check:
          linux: ~/.config/opencode/setup-temp-cleanup.sh --check
        run:
          linux: ~/.config/opencode/setup-temp-cleanup.sh --apply
        name: enable-temp-cleanup-timer
      - check:
          linux: ~/.config/opencode/setup-context-tokenizers.sh --check
          windows: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$HOME/.config/opencode/setup-context-tokenizers.ps1" -Check
        run:
          linux: ~/.config/opencode/setup-context-tokenizers.sh --apply
          windows: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$HOME/.config/opencode/setup-context-tokenizers.ps1" -Apply
        name: context-analysis tokenizers
  - name: interbase-mcp
    description: Keep the local InterBase MCP endpoints available
    when: '{{ and (eq .OS "linux") (eq .Hostname "antoinews-linux") }}'
    entries:
      - targets:
          linux: ~/.local/libexec/interbase-mcp
        name: supervisor
        backup: ./Linux/interbase-mcp
        files:
          - interbase-mcp-supervisor
      - targets:
          linux: ~/.config/systemd/user
        name: user-service
        backup: ./Linux/interbase-mcp/systemd
        files:
          - interbase-mcp.service
      - check:
          linux: 'target_user=${SUDO_USER:-$USER}; test "$(loginctl show-user "$target_user" --property=Linger --value)" = yes'
        run:
          linux: 'target_user=${SUDO_USER:-$USER}; loginctl enable-linger "$target_user"'
        name: enable-user-lingering
      - check:
          linux: systemctl --user is-enabled --quiet interbase-mcp.service && systemctl --user is-active --quiet interbase-mcp.service && test "$(systemctl --user show interbase-mcp.service --property=NeedDaemonReload --value)" = no && started=$(date --date="$(systemctl --user show interbase-mcp.service --property=ExecMainStartTimestamp --value)" +%s) && test "$started" -ge "$(stat -Lc %Y "$HOME/.local/libexec/interbase-mcp/interbase-mcp-supervisor")" && test "$started" -ge "$(stat -Lc %Y "$HOME/.config/systemd/user/interbase-mcp.service")"
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable interbase-mcp.service && systemctl --user restart interbase-mcp.service
        name: enable-service
  - package:
      managers:
        apt: neovim
        brew: neovim
        pacman: neovim
        winget: Neovim.Neovim
    name: neovim
    description: Vim-fork focused on extensibility and usability
    entries:
      - targets:
          linux: ~/.config/nvim
          windows: ~/AppData/Local/nvim
        name: config
        backup: ./Both/Neovim/nvim
      - targets:
          linux: ~/.local/share/nvim/site/spell
          windows: ~/AppData/Local/nvim-data/site/spell
        name: spell
        backup: ./Both/Neovim/spell
        files:
          - en.utf-8.add
  - package:
      managers:
        brew: starship
        pacman: starship
        winget: Starship.Starship
    name: starship
    description: Cross-shell prompt
    entries:
      - targets:
          linux: ~/.config
          windows: ~/.config
        name: config
        backup: ./Both/Starship
        files:
          - starship.toml
      - targets:
          linux: ~/.cache/starship
          windows: ~/.cache/starship
        name: cache
        backup: ./Both/Starship
        files:
          - init.nu
  - package:
      managers:
        winget: Nushell.Nushell
    name: nushell
    description: A new type of shell
    entries:
      - targets:
          linux: ~/.config/nushell
          windows: ~/AppData/Roaming/nushell
        name: config
        backup: ./Both/Nushell
        files:
          - env.nu
          - config.nu
      - targets:
          linux: ~/.config/nushell/themes
          windows: ~/AppData/Roaming/nushell/themes
        name: themes
        backup: ./Both/Nushell/themes
      - check:
          linux: test -x "$HOME/.local/bin/nu" && test "$("$HOME/.local/bin/nu" --version 2>/dev/null)" = 0.113.1
        run:
          linux: cargo install nu --locked --version 0.113.1 --root "$HOME/.local"
        name: exact-linux-version
  - package:
      managers:
        brew: wezterm
        pacman: wezterm
        winget: wez.wezterm
    name: wezterm
    description: GPU-accelerated terminal emulator
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          linux: "~"
          windows: "~"
        name: config
        backup: ./Both/Wezterm
        files:
          - .wezterm.lua
  - package:
