  - name: powershell
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: "~"
        name: config
        backup: ./Windows/PowerShell
  - name: komorebi
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: "~"
        name: config
        backup: ./Windows/Komorebi
        files:
          - komorebi.json
  - name: whkd
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: ~/.config
        name: config
        backup: ./Windows/Komorebi
        files:
