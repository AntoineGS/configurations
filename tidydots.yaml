          command:
            linux: curl -fsSL https://herdr.dev/install.sh | sh
            windows: powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"
          binary: herdr
    name: herdr
    entries:
      - targets:
          linux: ~/.config/herdr
          windows: ~/AppData/Roaming/herdr
        name: config
        backup: ./Both/Herdr
      - targets:
          linux: ~/.config/herdr/plugins/local/actionable-notifications
        name: actionable-notifications-config
        backup: ./Linux/herdr/actionable-notifications
      - check:
          linux: 'canonical_plugin_root="$(realpath -- "$HOME/.config/herdr/plugins/local/actionable-notifications")" && herdr plugin list --json | jq -e --arg plugin_root "$canonical_plugin_root" ''.result.plugins[] | select(.plugin_id == "local.actionable-notifications" and .enabled == true and .plugin_root == $plugin_root and ((.warnings // []) | length == 0))'' >/dev/null'
        run:
          linux: herdr plugin link "$HOME/.config/herdr/plugins/local/actionable-notifications" --enabled
        name: actionable-notifications-plugin
      - check:
          linux: herdr plugin action list --plugin vim-herdr-navigation | jq -e '.result.actions | length == 4' >/dev/null
        run:
          linux: herdr plugin install paulbkim-dev/vim-herdr-navigation --yes
        name: vim-navigation-plugin
