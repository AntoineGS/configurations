    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/modprobe.d
        name: config
        method: copy
        backup: ./Linux/modprobe
        files:
          - blacklist-raydium.conf
        sudo: true
  - name: udev-rules
    description: Detach faulty Raydium touchscreen driver to stop CRC storms and phantom cursor events after resume
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/udev/rules.d
        name: rules
        method: copy
        backup: ./Linux/udev
        files:
          - 90-disable-raydium.rules
        sudo: true
      - check:
          linux: test ! -e /sys/bus/i2c/drivers/raydium_ts/i2c-RAYD0001:00
        run:
          linux: udevadm control --reload-rules && udevadm trigger --subsystem-match=i2c
        name: apply-rules
        sudo: true
