  - package:
      managers:
        apt: zsh
        brew: zsh
        pacman: zsh
    name: zsh
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: "~"
        name: config
        backup: ./Linux/zsh
        files:
          - .zshenv
          - .zshrc
      - targets:
          linux: ~/.local/share/zsh/completions
        name: completions
        backup: ./Linux/zsh/completions
      - check:
          linux: 'test "$(getent passwd "$USER" | cut -d: -f7)" = /usr/bin/zsh'
        run:
          linux: chsh -s /usr/bin/zsh "$SUDO_USER"
        name: default-shell
        sudo: true
  - package:
      managers:
        installer:
          command:
            linux: curl -fsSL https://omp.sh/install | sh -s -- --binary
          binary: omp
    name: oh-my-pi
    description: Batteries-included Pi fork with native LSP, subagents, and Agent Hub
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.omp/agent
        name: config
        backup: ./Linux/omp/agent
        files:
          - config.yml
          - AGENTS.md
          - lsp-first.md
          - worktree-preferences.md
          - commit-exclusions.md
      - targets:
          linux: ~/.omp/agent/agents
        name: agents
        backup: ./Linux/omp/agent/agents
      - targets:
          linux: ~/.omp/agent/skills
        name: skills
        backup: ./Linux/omp/agent/skills
      - targets:
          linux: ~/.omp/agent/commands
        name: commands
        backup: ./Linux/omp/agent/commands
      - check:
          linux: 'omp plugin list --json | awk ''BEGIN { in_npm = 0; in_entry = 0; target = 0; enabled = 0; found = 0 } /^  "npm": \[$/ { in_npm = 1; next } in_npm && /^  "marketplace":/ { in_npm = 0; next } in_npm && /^    \{$/ { in_entry = 1; target = 0; enabled = 0; next } in_npm && in_entry && /^      "name": "superpowers",?$/ { target = 1; next } in_npm && in_entry && /^      "enabled": true,?$/ { enabled = 1; next } in_npm && in_entry && /^      "enabled": false,?$/ { enabled = 0; next } in_npm && in_entry && /^    \},?$/ { if (target && enabled) found = 1; in_entry = 0 } END { exit !found }'''
        run:
          linux: omp plugin install github:obra/superpowers
        name: superpowers
      - check:
          linux: "herdr integration status | grep -q '^omp: current '"
        run:
          linux: herdr integration install omp
        name: herdr-integration
      - check:
          linux: 'omp plugin list --json | awk ''BEGIN { in_npm = 0; in_entry = 0; target = 0; enabled = 0; found = 0 } /^  "npm": \[$/ { in_npm = 1; next } in_npm && /^  "marketplace":/ { in_npm = 0; next } in_npm && /^    \{$/ { in_entry = 1; target = 0; enabled = 0; next } in_npm && in_entry && /^      "name": "@andrewjacop\/pi-herdr",?$/ { target = 1; next } in_npm && in_entry && /^      "enabled": true,?$/ { enabled = 1; next } in_npm && in_entry && /^      "enabled": false,?$/ { enabled = 0; next } in_npm && in_entry && /^    \},?$/ { if (target && enabled) found = 1; in_entry = 0 } END { exit !found }'''
        run:
          linux: omp plugin install @andrewjacop/pi-herdr
        name: pi-herdr
      - check:
          linux: test -s ~/.local/share/zsh/completions/_omp
        run:
          linux: mkdir -p ~/.local/share/zsh/completions && omp completions zsh > ~/.local/share/zsh/completions/_omp
        name: zsh-completion
