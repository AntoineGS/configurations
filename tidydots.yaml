        name: config
        backup: ./Windows/Yasb
        files:
          - config.yaml
          - styles.css
  - name: windows-terminal
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          windows: ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState
        name: config
        backup: ./Windows/WindowsTerminal
        files:
          - settings.json
  - name: total-commander
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: ~/AppData/Roaming/GHISLER
        name: config
        backup: ./Windows/TotalCommander
        files:
          - wincmd.ini
      - targets:
          windows: ~/AppData/Roaming/Everything
        name: everything
        backup: ./Windows/TotalCommander
        files:
          - Everything-1.5a.ini
  - package:
      managers:
        apt: bash
        pacman: bash
    name: bash
    entries:
      - targets:
          linux: "~"
        name: config
        backup: ./Linux/Bash
        files:
          - .bashrc
  - package:
      managers:
        apt: zsh
        brew: zsh
        pacman: zsh
    name: zsh
    entries:
      - targets:
          linux: "~"
        name: config
        backup: ./Linux/zsh
        files:
          - .zshenv
          - .zshrc
      - targets:
          linux: ~/.local/share/zsh/completions
        name: completions
        backup: ./Linux/zsh/completions
      - name: default-shell
        check:
          linux: 'test "$(getent passwd "$USER" | cut -d: -f7)" = /usr/bin/zsh'
        run:
          linux: 'chsh -s /usr/bin/zsh "$SUDO_USER"'
        sudo: true
  - package:
      managers:
        apt: tmux
        brew: tmux
        pacman: tmux
    name: tmux
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: "~"
        name: config
        backup: ./Linux/tmux
        files:
          - .tmux.conf
      - targets:
          linux: ~/.config/tmux
        name: scripts
        backup: ./Linux/tmux
        files:
          - clear-claude-bell.sh
  - package:
      managers:
        winget: Zellij.Zellij
    name: zellij
    description: Terminal multiplexer
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: ~/AppData/Roaming/Zellij/config
        name: config
        backup: ./Both/Zellij
        files:
          - config.kdl
      - targets:
          windows: ~/AppData/Roaming/Zellij/config/themes
        name: themes
        backup: ./Both/Zellij/themes
      - targets:
          windows: ~/AppData/Roaming/Zellij/config/layouts
        name: layouts
        backup: ./Both/Zellij/layouts
      - targets:
          windows: ~/AppData/Roaming/Zellij/config/plugins
        name: plugins
        backup: ./Both/Zellij/plugins
  - package:
      managers:
        pacman: hyprland
    name: hyprland
    description: Dynamic tiling Wayland compositor
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/hypr
        name: config
        backup: ./Linux/hypr
      - targets:
          linux: ~/.config/systemd/user
        name: rustdesk-service
        backup: ./Linux/hypr
        files:
          - watch-rustdesk-submap.service
      - name: enable-rustdesk-service
        check:
          linux: systemctl --user is-enabled --quiet watch-rustdesk-submap.service
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now watch-rustdesk-submap.service
      - targets:
          linux: ~/.config/systemd/user
        name: external-keyboard-service
        backup: ./Linux/hypr
        files:
          - watch-external-keyboard.service
      - name: enable-external-keyboard-service
        check:
          linux: systemctl --user is-enabled --quiet watch-external-keyboard.service
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now watch-external-keyboard.service
  - package:
      managers:
        pacman: waybar
        yay:
          deps:
            - claudebar
            - codexbar
    name: waybar
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/waybar
        name: config
        backup: ./Linux/waybar
  - name: uwsm
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/uwsm/default
        name: config
        backup: ./Linux/uwsm/default
  - name: sddm
    when: '{{ eq .Hostname "DESKTOP-E07VTRN" }}'
    entries:
      - targets:
          linux: /etc/sddm.conf.d
        name: config
        backup: ./Linux/sddm
        files:
          - autologin.conf
        sudo: true
  - name: qmk
    when: '{{ eq .Hostname "DESKTOP-E07VTRN" }}'
    entries:
      - targets:
          linux: ~/.config/qmk
        name: config
        backup: ./Linux/qmk
      - targets:
          linux: ~/qmk_firmware/keyboards/beekeeb/piantor_pro/keymaps/AntoineGS
        name: piantor
        backup: ./Linux/QMK/piantor_pro/AntoineGS
      - targets:
          linux: ~/qmk_firmware/keyboards/ploopyco/trackball_nano/keymaps/AntoineGS
        name: trackball
        backup: ./Linux/QMK/trackball_nano/AntoineGS
      - targets:
          linux: ~/qmk_firmware/keyboards/sofle_choc/keymaps/AntoineGS
        name: sofle
        backup: ./Linux/QMK/sofle_choc/AntoineGS
  - name: warp
    when: '{{ false }}'
    entries:
      - targets:
          linux: ~/.config/warp-terminal
        name: config
        backup: ./Linux/Warp
        files:
          - user_preferences.json
  - package:
      managers:
        apt: teams-for-linux
        brew: teams-for-linux
        pacman: teams-for-linux
        yay: teams-for-linux-electron-bin
    name: teams-for-linux
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/teams-for-linux
        name: config
        backup: ./Linux/teams-for-linux
        files:
          - config.json
  - package:
      managers:
        brew: fzf
        pacman:
          deps:
            - kitten
          name: fzf
        winget: junegunn.fzf
    name: fzf
    description: Command-line fuzzy finder
    entries:
      - targets:
          linux: ~/.config/fzf
        name: config
        backup: ./Linux/fzf
  - package:
      managers:
        pacman: ghostty
    name: ghostty
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/ghostty
        name: config
        backup: ./Linux/ghostty
      - targets:
          linux: ~/.config
        name: default terminal
        backup: ./Linux/xdg-terminals
        files:
          - xdg-terminals.list
  - name: fastfetch
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.config/fastfetch
        name: config
        backup: ./Linux/fastfetch
  - name: fontconfig
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/fontconfig
        name: config
        backup: ./Linux/fontconfig
  - name: hyprland-preview-share-picker
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/hyprland-preview-share-picker
        name: config
        backup: ./Linux/hyprland-preview-share-picker
  - name: imv
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/imv
        name: config
        backup: ./Linux/imv
  - name: mako
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/mako
        name: config
        backup: ./Linux/mako
  - name: mise
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.config/mise
        name: config
        backup: ./Linux/mise
        files:
          - config.toml
  - name: swayosd
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/swayosd
        name: config
        backup: ./Linux/swayosd
  - name: typora
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/Typora/themes
        name: themes
        backup: ./Linux/Typora/themes
  - name: wiremix
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/wiremix
        name: config
        backup: ./Linux/wiremix
  - package:
      managers:
        yay: vicinae-bin
    name: vicinae
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/vicinae
        name: config
        backup: ./Linux/vicinae
        files:
          - settings.json
      - targets:
          linux: ~/.local/share/vicinae/scripts
        name: scripts
        backup: ./Linux/vicinae/scripts
      - name: enable-service
        check:
          linux: systemctl --user is-enabled --quiet vicinae.service
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now vicinae.service
  - name: autostart
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config/autostart
        name: config
        backup: ./Linux/autostart
  - name: browser-flags
    when: '{{ and .HasDisplay (eq .OS "linux") (not .IsWSL) }}'
    entries:
      - targets:
          linux: ~/.config
        name: config
        backup: ./Linux/browser-flags
        files:
          - brave-flags.conf
          - chromium-flags.conf
  - package:
      managers:
        yay: python-lnxlink
    name: lnxlink
    when: '{{ eq .Hostname "DESKTOP-E07VTRN" }}'
    entries:
      - targets:
          linux: ~/.config/lnxlink
        name: conf
        backup: ./Linux/lnxlink
        files:
          - config.yaml
  - name: modprobe
    description: Blacklist the faulty Raydium touchscreen. Copied, not symlinked - modprobe.d is read before /home mounts, so a symlink into this repo is a dangling link at boot.
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/modprobe.d
        name: config
        method: copy
        backup: ./Linux/modprobe
        files:
          - blacklist-raydium.conf
        sudo: true
  - name: udev-rules
    description: Detach faulty Raydium touchscreen driver to stop CRC storms and phantom cursor events after resume
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/udev/rules.d
        name: rules
        method: copy
        backup: ./Linux/udev
        files:
          - 90-disable-raydium.rules
        sudo: true
      - name: apply-rules
        check:
          linux: 'test ! -e /sys/bus/i2c/drivers/raydium_ts/i2c-RAYD0001:00'
        run:
          linux: 'udevadm control --reload-rules && udevadm trigger --subsystem-match=i2c'
        sudo: true
  - name: system-sleep-hooks
    description: Post-resume hooks (e.g. rebind elan_i2c touchpad to avoid dmesg flood + fan ramp)
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /usr/lib/systemd/system-sleep
        name: hooks
        backup: ./Linux/system-sleep
        files:
          - elan-i2c-rebind
          - atkbd-rebind
          - tzupdate-resume
        sudo: true
  - package:
      managers:
        yay: tzupdate
        apt: tzupdate
        brew: tzupdate
    name: tzupdate
    description: Auto-set the system timezone from IP geolocation. Timer polls on boot + hourly; the system-sleep resume hook (in system-sleep-hooks) fires it promptly after travel. iwd exposes no connection-up hook and NetworkManager isn't used on this host, hence polling.
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/systemd/system
        name: units
        backup: ./Linux/tzupdate
        files:
          - tzupdate.service
          - tzupdate.timer
        sudo: true
      - name: enable-tzupdate-timer
        check:
          linux: systemctl is-enabled --quiet tzupdate.timer
        run:
          linux: systemctl daemon-reload && systemctl enable --now tzupdate.timer
        sudo: true
  - name: logind-config
    description: Hibernate on lid close (workaround for ballistic fan in S3)
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - targets:
          linux: /etc/systemd/logind.conf.d
        name: drop-ins
        backup: ./Linux/systemd/logind.conf.d
        files:
          - hibernate-on-lid.conf
        sudo: true
      - name: reload-logind
        check:
          linux: 'busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager HandleLidSwitch | grep -q hibernate'
        run:
          linux: 'systemctl reload systemd-logind'
        sudo: true
  - name: yay
    description: AUR helper config (7-day minimum release-age hook)
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.config/yay
        name: config
        backup: ./Linux/yay
        files:
          - init.lua
  - name: os-files
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.config
        name: config
        backup: ./Linux/os
        files:
          - mimeapps.list
      - targets:
          linux: ~/.local/share/helpers
        name: helper scripts
        backup: ./Linux/os/helpers
      - targets:
          linux: ~/.local/share/applications
        name: .desktop files
        backup: ./Linux/os/applications
      - targets:
          linux: ~/.config/systemd/user
        name: battery-monitor-service
        backup: ./Linux/os/systemd
        files:
          - battery-monitor.service
          - battery-monitor.timer
      - name: enable-battery-monitor
        check:
          linux: systemctl --user is-active --quiet battery-monitor.timer
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now battery-monitor.timer
  - name: nvim-open
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.local/bin
        name: script
        backup: ./Linux/scripts
        files:
          - nvim-open
  - package:
      managers:
        pacman:
          deps:
            - rebuild-detector
          name: pacman-contrib
    name: pacman-hooks
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: /usr/share/libalpm/hooks
        name: hooks
        backup: ./Linux/pacman
        files:
          - pkg-backup-aur.hook
          - pkg-backup-pacman.hook
          - pkg-checkrebuild.hook
          - clean-cache.hook
        sudo: true
  - name: ssh-agent
    description: SSH agent with 4-hour key lifetime (replaces 1Password agent)
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: ~/.config/systemd/user/ssh-agent.service.d
        name: systemd-override
        backup: ./Linux/ssh-agent/ssh-agent.service.d
      - targets:
          linux: ~/.config/environment.d
        name: environment
        backup: ./Linux/ssh-agent
        files:
          - ssh-agent.conf
      - targets:
          linux: ~/.ssh
        name: ssh-config
        backup: ./Linux/ssh-agent
        files:
          - config
      - name: enable-socket
        check:
          linux: systemctl --user is-enabled --quiet ssh-agent.socket
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now ssh-agent.socket
  - name: systemd-units
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: /etc/systemd/system
        name: units
        backup: ./Linux/systemd
        files:
          - units-backup.service
          - units-backup.timer
        sudo: true
      - name: enable-backup-timer
        check:
          linux: systemctl is-active --quiet units-backup.timer
        run:
          linux: systemctl daemon-reload && systemctl enable --now units-backup.timer
        sudo: true
  - name: enable-laptop-services
    description: Enable services tied to this laptop's hardware (thermal, wifi)
    when: '{{ eq .Hostname "omarchbook" }}'
    entries:
      - name: enable-thermald
        check:
          linux: systemctl is-enabled --quiet thermald.service
        run:
          linux: systemctl enable --now thermald.service
        sudo: true
      - name: enable-iwd
        check:
          linux: systemctl is-enabled --quiet iwd.service
