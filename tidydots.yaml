          - codex-usage.ps1
          - styles.css
  - name: windows-terminal
    when: '{{ eq .OS "windows" }}'
    entries:
      - targets:
          windows: ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState
        name: config
        backup: ./Windows/WindowsTerminal
        files:
          - settings.json
  - package:
      managers:
        apt: bash
        pacman: bash
    name: bash
    when: '{{ eq .OS "linux" }}'
    entries:
      - targets:
          linux: "~"
        name: config
        backup: ./Linux/Bash
        files:
