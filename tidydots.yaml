    entries:
      - targets:
          linux: /usr/local/libexec/antoinews-linux
        name: setup-fstab-helper
        method: copy
        backup: ./Linux/office-shares
        files:
          - setup-office-shares-fstab
        sudo: true
      - check:
          linux: /usr/local/libexec/antoinews-linux/setup-office-shares-fstab --check
        run:
          linux: /usr/local/libexec/antoinews-linux/setup-office-shares-fstab --apply
        name: setup-fstab
        sudo: true
      - check:
          linux: test ! -e /usr/local/libexec/antoinews-linux/refresh-office-shares-credentials && test ! -e /usr/share/polkit-1/actions/local.multidev.office-shares.policy && test ! -e /etc/polkit-1/rules.d/10-office-shares.rules
        run:
          linux: rm -f -- /usr/local/libexec/antoinews-linux/refresh-office-shares-credentials /usr/share/polkit-1/actions/local.multidev.office-shares.policy /etc/polkit-1/rules.d/10-office-shares.rules
        name: remove-legacy-polkit-auth
        sudo: true
      - targets:
          linux: ~/.local/libexec/office-shares
        name: mount-helper
        backup: ./Linux/office-shares
        files:
          - mount-office-shares
          - check-office-shares-auth
          - mount-md-ftp
      - targets:
          linux: ~/.config/systemd/user
        name: user-units
        backup: ./Linux/office-shares
        files:
          - office-shares-mount.service
          - office-shares-mount.timer
          - office-shares-auth-check.service
          - office-shares-auth-check.timer
          - md-ftp-mount.service
          - md-ftp-mount.timer
      - check:
          linux: systemctl --user is-enabled --quiet office-shares-mount.timer && systemctl --user is-active --quiet office-shares-mount.timer && systemctl --user is-enabled --quiet office-shares-auth-check.timer && systemctl --user is-active --quiet office-shares-auth-check.timer && test "$(systemctl --user show office-shares-mount.timer --property=NeedDaemonReload --value)" = no && test "$(systemctl --user show office-shares-auth-check.timer --property=NeedDaemonReload --value)" = no
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now office-shares-mount.timer office-shares-auth-check.timer
        name: enable-timer
      - check:
          linux: systemctl --user is-enabled --quiet md-ftp-mount.timer && systemctl --user is-active --quiet md-ftp-mount.timer && test "$(systemctl --user show md-ftp-mount.timer --property=NeedDaemonReload --value)" = no
        run:
          linux: systemctl --user daemon-reload && systemctl --user enable --now md-ftp-mount.timer
        name: enable-md-ftp-timer
