          name: sxyazi.yazi
    name: yazi
    description: Terminal file manager
    entries:
      - targets:
          linux: ~/.config/yazi
          windows: ~/AppData/Roaming/yazi/config
        name: config
        backup: ./Both/Yazi
  - package:
