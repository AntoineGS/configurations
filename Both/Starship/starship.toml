[fortran]
format = '[$symbol($version)]($style) '
symbol = " "

[fossil_branch]
format = '[$symbol$branch]($style) '
symbol = " "

[fossil_metrics]
format = '[+$added]($added_style)\[[-$deleted]($deleted_style)\] '

[gcloud]
format = '$symbol'#'[$symbol$account(@$domain)(\($region\))]($style) '
symbol = " "

[git_branch]
format = '[$symbol$branch]($style) '
symbol = " "

[git_commit]
format = '[\($hash$tag\)]($style) '
tag_symbol = '  '

[git_metrics]
format = '[+$added]($added_style)\[[-$deleted]($deleted_style)\] '

[git_state]
format = '[$state ($progress_current/$progress_total)]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style)) '
ahead = ""
behind = ""
diverged = ""
up_to_date = ""

[gleam]
format = '[$symbol($version)]($style) '

[golang]
format = '[$symbol($version)]($style) '
symbol = " "

[gradle]
format = '[$symbol($version)]($style) '
symbol = " "

[guix_shell]
