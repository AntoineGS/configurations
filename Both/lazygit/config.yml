notARepository: skip
gui:
  showDivergenceFromBaseBranch: arrowAndNumber
  spinner:
    rate: 200
  theme:
    activeBorderColor:
      - "#cba6f7" # mauve
      - bold
    inactiveBorderColor:
      - "#7f849c" # overlay1
    searchingActiveBorderColor:
      - "#f9e2af" # yellow
    optionsTextColor:
      - "#89b4fa" # blue
    selectedLineBgColor:
      - "#585b70" # surface2
    inactiveViewSelectedLineBgColor:
      - "#45475a" # surface1
    cherryPickedCommitFgColor:
      - "#89b4fa" # blue
    cherryPickedCommitBgColor:
      - "#45475a" # surface1
    markedBaseCommitFgColor:
      - "#89b4fa" # blue
    markedBaseCommitBgColor:
      - "#f9e2af" # yellow
    unstagedChangesColor:
      - "#f38ba8" # red
    defaultFgColor:
      - "#cdd6f4" # text
  authorColors:
    "*": "#b4befe" # lavender
git:
  pagers:
    # lazygit (Windows pty) reports a fixed width to the pager, so side-by-side
    # can't auto-toggle by width here. Default to unified; press `|` to cycle to
    # side-by-side (pairs well with `+` to expand the diff panel).
    - pager: delta --paging=never
    - pager: delta --side-by-side --paging=never
os:
  editPreset: "nvim"
keybinding:
  universal:
    prevPage: "<c-u>"
    nextPage: "<c-d>"
    scrollUpMain: ","
    scrollDownMain: "."
    scrollUpMain-alt2: "<disabled>"
    scrollDownMain-alt2: "<disabled>"
  commits:
    moveDownCommit: "J"
    moveUpCommit: "K"
    openLogMenu: ";"
