[mgr]
prepend_keymap = [
  { on = [ "q" ], run = "plugin sessionquit", desc = "Quit (save session if launched with autosession)" },
  { on = [ "Q" ], run = "quit",               desc = "Quit without saving session" },
  { on = [ "<C-y>" ], run = '''shell -- for path in %s; do printf 'file://%s\n' "$path"; done | wl-copy --type text/uri-list''', desc = "Copy file(s)/folder(s) to Linux clipboard", for = "linux" },
  { on = [ "<C-y>" ], run = '''shell 'powershell -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\yazi\config\clip.ps1" %*' --block''', desc = "Copy file(s)/folder(s) to Windows clipboard", for = "windows" },
]
