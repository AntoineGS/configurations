[mgr]
show_hidden=true
linemode="size_and_mtime"

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
  { run = 'nvim %*',   block = true, for = "windows" },
]
launch = [
  { run = 'start "" %*', orphan = true, for = "windows" },
]
admin = [
  { run = 'gsudo %*', orphan = true, for = "windows" },
]

[open]
prepend_rules = [
  # Anything yazi detects as text (README, LICENSE, .gitignore, etc.) → nvim
  { mime = "text/*", use = [ "edit", "launch", "admin" ] },
  # Code, config, markup, and scripts → nvim
  { name = "*.{js,jsx,ts,tsx,mjs,cjs,vue,svelte,astro,json,jsonc,json5,yaml,yml,toml,ini,cfg,conf,properties,xml,xsl,xslt,html,htm,xhtml,css,scss,sass,less,styl,md,markdown,mdx,rst,adoc,tex,bib,sql,sh,bash,zsh,fish,nu,ps1,psm1,psd1,bat,cmd,vbs,wsf,awk,sed,lua,py,pyw,rb,pl,pm,php,go,rs,c,h,cpp,hpp,cc,cxx,cs,java,kt,kts,scala,swift,m,mm,dart,ex,exs,erl,hrl,hs,clj,cljs,cljc,ml,mli,fs,fsx,fsi,vb,pas,pp,dpr,dpk,asm,s,nim,zig,d,jl,r,lisp,el,scm,rkt,tcl,gd,patch,diff,env,hcl,tf,tfvars,nix,svg,csv,tsv,log,txt}", use = [ "edit", "launch", "admin" ] },
  # Common extensionless filenames
  { name = "{Makefile,makefile,GNUmakefile,Dockerfile,Containerfile,Jenkinsfile,Rakefile,Gemfile,Vagrantfile,Procfile,Justfile,Taskfile,CMakeLists.txt,BUILD,WORKSPACE,LICENSE,LICENCE,README,CHANGELOG,AUTHORS,CONTRIBUTORS,NOTICE,TODO,COPYING,INSTALL,VERSION}", use = [ "edit", "launch", "admin" ] },
  # Everything else → Windows default app (edit available as fallback via O menu)
  { url = "*", use = [ "launch", "edit", "admin" ] },
]

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"
