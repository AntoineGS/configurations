# Fixed Catppuccin Mocha surface tokens for the repository-owned shell.

[font]
base-size = 14

[bar]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
active = "#f9e2af"

[controls]
hover-cursor-color = "accent"

[popups]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0

[tooltip]
background = "#1e1e2e"
background-alpha = 0.97
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0

[menu]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0
scrim = "#1e1e2e"
scrim-alpha = 0.5
selected-background = "#7f849c"
selected-background-alpha = 0.18
selected-text = "#cba6f7"
selected-border = "#cba6f7"
selected-border-alpha = 0.25

[notifications]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0
countdown = "#cba6f7"

[polkit]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
text-error = "#f38ba8"
border = "#cba6f7"
border-error = "#f38ba8"
border-alpha = 1.0
accent = "#cba6f7"
scrim = "#1e1e2e"
scrim-alpha = 0.5

[lock]
background = "#1e1e2e"
background-alpha = 0.8
text = "#cdd6f4"
placeholder = "#7f849c"
text-error = "#f38ba8"
border = "#7f849c"
border-active = "#cba6f7"
border-error = "#f38ba8"
border-alpha = 1.0
selection = "#cba6f7"
selection-alpha = 0.45
