# Fixed Catppuccin Mocha surface tokens for the repository-owned shell.

[font]
base-size = 14

[bar]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
active = "#f9e2af"

[controls]
hover-cursor-color = "accent"

# Shared notification, Bar hint, and Bar panel chrome. Add a token to the
# corresponding surface section only when that surface should diverge.
[cards]
background = "#303143"
background-alpha = 1.0
text = "#f8f5ff"
text-secondary = "#b8c9ff"
border = "#303143"
border-alpha = 1.0
border-width = 2

[popups]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0

[menu]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
border = "#cba6f7"
border-alpha = 1.0
scrim = "#1e1e2e"
scrim-alpha = 0.5
selected-background = "#7f849c"
selected-background-alpha = 0.18
selected-text = "#cba6f7"
selected-border = "#cba6f7"
selected-border-alpha = 0.25

[notifications]
background = "#b4befe"
background-alpha = 1.0
text = "#11111b"
text-secondary = "#11111b"
border = "transparent"
border-alpha = 0.0
border-width = 0
countdown = "#11111b"
low = "#89dceb"
critical = "#f38ba8"

[polkit]
background = "#1e1e2e"
background-alpha = 1.0
text = "#cdd6f4"
text-error = "#f38ba8"
border = "#cba6f7"
border-error = "#f38ba8"
border-alpha = 1.0
accent = "#cba6f7"
scrim = "#1e1e2e"
scrim-alpha = 0.5

[lock]
background = "#1e1e2e"
background-alpha = 0.8
text = "#cdd6f4"
placeholder = "#7f849c"
text-error = "#f38ba8"
border = "#7f849c"
border-active = "#cba6f7"
border-error = "#f38ba8"
border-alpha = 1.0
selection = "#cba6f7"
selection-alpha = 0.45
