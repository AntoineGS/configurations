[Unit]
Conflicts=tailscaled.service
After=tailscaled.service

[Service]
Environment="TAILMIXD_FLAGS=-mode=tun -auto-update=false"
TimeoutStartSec=40
ExecStartPost=/usr/bin/timeout 30 /bin/sh -c 'until /usr/local/bin/tailmix --socket-dir /var/run/tailmix status --json >/dev/null 2>&1; do sleep 0.2; done'
