FieldsOrder=0
AutoSortByPK=0
VimMode=1
[VimKeys]
; Chord syntax: space-separated keys. Modifiers: Ctrl+ Shift+ Alt+.
;   Named keys: Space, Tab, Enter, Esc. A lone uppercase letter implies Shift.
;   Examples:   Space q e      Ctrl+L      g h      Shift+Tab

; --- Navigation (always available) ---
;cursor.left=h
;cursor.down=j
;cursor.up=k
;cursor.right=l
;cursor.page-up=Ctrl+U
;cursor.page-down=Ctrl+D
;cursor.top=g g
;cursor.bottom=G

; --- Search / insert mode ---
;search.start=/
; mode.insert is bound to both 'i' and 'a' by default; overriding it here
; collapses it to the single chord you specify.
;mode.insert=i

; --- Tree commit (active in tree / favorites panels) ---
;tree.commit=Enter

; --- Spatial panel jumps (always available) ---
;panel.left=Ctrl+H
;panel.down=Ctrl+J
;panel.up=Ctrl+K
;panel.right=Ctrl+L

; --- Query (leader: Space q) ---
;query.execute=Space q e
;query.next=Space q n
;query.previous=Space q p
;view.close=Space q c
;query.tab.text=Space q t t
;query.tab.data=Space q t d
;query.tab.sql=Space q t s
;query.tab.diagram=Space q t e

; --- View tab cycle (in a query view) ---
;view.tab.next=Tab
;view.tab.previous=Shift+Tab

; --- Views (leader: Space v) ---
;view.add=Space v a
;view.add-tab=Space v t

; --- Blob viewer / export ---
;blob.open=Space b
;view.export=Space x

; --- Grid / dataset (leader: Space g) ---
;grid.insert=Space g i
;grid.delete=Space g d
;grid.post=Space g p
;grid.cancel=Space g c
;grid.refresh=Space g r

; --- Named panel jumps (leader: Space p) ---
;panel.favorites=Space p f
;panel.tree=Space p t
;panel.query=Space p q
;panel.sql=Space p s
;panel.grid=Space p g
;panel.filter=Space p i
;panel.toolbar=Space p b

; --- Search (leader: Space s) ---
;search.main=Space s m
;search.filter=Space s f

; --- Database ---
;db.register-new=Space n

; --- Fuzzy finders (leader: Space f) ---
;fuzzy.favorites=Space f F
;fuzzy.databases=Space f d
;fuzzy.tables=Space f t
;fuzzy.fields=Space f f

; --- Help ---
;help.show-all=Space ?
[Databases]
Multidev=C:\Multidev\databases.ini
