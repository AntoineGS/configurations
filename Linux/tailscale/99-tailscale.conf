# Enable IP forwarding so this host can act as a Tailscale subnet router.
# Required so remote Tailscale clients can reach 192.168.1.0/24 (the RustDesk
# hbbs/hbbr relay on 192.168.1.15), which is what makes relayed sessions to the
# isolated work PC work from outside the LAN.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
