[Service]
# -s 100 ignores swap: with a large disk swapfile, waiting for swap to fill means the machine thrashes and freezes first.
ExecStart=
ExecStart=/usr/bin/earlyoom -m 10 -s 100 -r 3600 -n --avoid '^(Hyprland|Xwayland|sddm|sddm-helper|systemd|systemd-logind|dbus-broker|dbus-daemon|pipewire|wireplumber|sshd)$$'
