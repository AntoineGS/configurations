onboarding = false

[keys]
prefix = "ctrl+b"
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+s"
goto = "prefix+w"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
open_worktree = ""
remove_worktree = ""
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
previous_agent = ""
next_agent = ""
focus_agent = ""
remote_image_paste = "ctrl+v"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
switch_workspace = ""
close_tab = "prefix+ampersand"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
copy_mode = ["prefix+[", "prefix+y"]
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+o"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[keys.indexed]
tabs = ""
workspaces = ""
agents = ""

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "powershell.exe -NoLogo"
description = "open scratch shell"
width = "90%"
height = "90%"
